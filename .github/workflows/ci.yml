# CI for the PUBLISHED repository (github.com/mycelhq/mycel), where the kernel is the root.
#
# This file is inert in the upstream monorepo: GitHub only reads workflows from `.github/` at the
# REPOSITORY root, and here that path is `kernel/.github/`. It becomes live the moment the publish
# snapshot lifts `kernel/` to the root. That is deliberate — it means the public repo's CI is
# version-controlled and reviewed alongside the code it tests, rather than being configured by hand
# in a repo nobody develops in.
#
# The monorepo's own equivalent is `.github/workflows/kernel.yml`, which does the same two steps with
# a `working-directory: kernel`. Keep them in step; if they drift, the public repo is the one that
# breaks in front of strangers.
name: ci

# ═══ ONCE PER COMMIT, NOT FOUR TIMES ═══
#
# This was `push: branches: ["**"]` AND `pull_request:`, which is the configuration the monorepo
# measured and removed: a branch with a PR open ran every job TWICE on the same commit, and with no
# `concurrency` group, three commits pushed in a minute ran three full matrices to completion —
# including the two whose results nobody would ever read.
#
# In a public repo that lands on contributors. Their PR check takes twice as long as it needs to,
# and a fix pushed on top of a mistake waits behind a run of the mistake. Pushing to a branch is not
# a trigger; the PR is, which also covers forks. `main` has no PR to stand in for it, so it keeps
# its own.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The suite runs fully in-memory by default. Postgres is supplied so the durability,
      # multi-instance and two-backend-parity tests actually execute rather than silently skipping —
      # those are exactly the tests that caught the memory/Postgres store disagreements.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: mycel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test (in-memory + postgres durability + multi-instance)
        env:
          MYCEL_TEST_DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/mycel_test
        run: npm test
