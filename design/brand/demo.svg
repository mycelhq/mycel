  <text x="352" y="22" fill="#6e7681" font-size="11" text-anchor="middle">npm run demo</text>
  <text xml:space="preserve" y="52"><tspan x="24.0" fill="#c9d1d9" font-weight="600">  RANKED NEXT MOVES  </tspan><tspan x="200.4" fill="#6e7681" font-weight="600">·</tspan><tspan x="208.8" fill="#c9d1d9">  Sightline Research</tspan></text>
  <text xml:space="preserve" y="72"><tspan x="24.0" fill="#6e7681">  9 things to do, in the order the kernel would do them.</tspan></text>
  <text xml:space="preserve" y="92"><tspan x="24.0" fill="#6e7681">──────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text xml:space="preserve" y="132"><tspan x="24.0" fill="#c9d1d9">  </tspan><tspan x="40.8" fill="#c9d1d9" font-weight="600"> 1</tspan><tspan x="57.6" fill="#c9d1d9">  </tspan><tspan x="74.4" fill="#3fb950"> 77.8</tspan><tspan x="116.4" fill="#c9d1d9">  chase invoice         Invoice INV-0001                  $2,970.00</tspan></text>
  <text xml:space="preserve" y="152"><tspan x="24.0" fill="#6e7681">        INV-0001 is 34 days overdue with $2,970.00 outstanding; never chased</tspan></text>
  <text xml:space="preserve" y="172"><tspan x="24.0" fill="#6e7681">        money +27.8 · deadline +30 · staleness +20</tspan></text>
  <text xml:space="preserve" y="192"><tspan x="24.0" fill="#6e7681">        ⏸ Not chasing INV-0001: this business has no mailbox connected, so the</tspan></text>
  <text xml:space="preserve" y="212"><tspan x="24.0" fill="#6e7681">        reminder could be written but never sent and nothing would reach your</tspan></text>
  <text xml:space="preserve" y="232"><tspan x="24.0" fill="#6e7681">        client. Connect the email account you invoice from and this will start</tspan></text>
  <text xml:space="preserve" y="252"><tspan x="24.0" fill="#6e7681">        on its own.</tspan></text>
  <text xml:space="preserve" y="292"><tspan x="24.0" fill="#c9d1d9">  </tspan><tspan x="40.8" fill="#c9d1d9" font-weight="600"> 2</tspan><tspan x="57.6" fill="#c9d1d9">  </tspan><tspan x="74.4" fill="#3fb950"> 67.2</tspan><tspan x="116.4" fill="#c9d1d9">  chase invoice         Invoice INV-0002                  $4,450.00</tspan></text>
  <text xml:space="preserve" y="312"><tspan x="24.0" fill="#6e7681">        INV-0002 is 12 days overdue with $4,450.00 outstanding; never chased</tspan></text>
  <text xml:space="preserve" y="332"><tspan x="24.0" fill="#6e7681">        money +29.2 · deadline +30 · staleness +8</tspan></text>
  <text xml:space="preserve" y="352"><tspan x="24.0" fill="#6e7681">        ⏸ Not chasing INV-0002: this business has no mailbox connected, so the</tspan></text>
  <text xml:space="preserve" y="372"><tspan x="24.0" fill="#6e7681">        reminder could be written but never sent and nothing would reach your</tspan></text>
  <text xml:space="preserve" y="392"><tspan x="24.0" fill="#6e7681">        client. Connect the email account you invoice from and this will start</tspan></text>
  <text xml:space="preserve" y="412"><tspan x="24.0" fill="#6e7681">        on its own.</tspan></text>
  <text xml:space="preserve" y="452"><tspan x="24.0" fill="#c9d1d9">  </tspan><tspan x="40.8" fill="#c9d1d9" font-weight="600"> 3</tspan><tspan x="57.6" fill="#c9d1d9">  </tspan><tspan x="74.4" fill="#3fb950"> 36.0</tspan><tspan x="116.4" fill="#c9d1d9">  client cannot see it  Fernwood Health                            </tspan></text>
  <text xml:space="preserve" y="472"><tspan x="24.0" fill="#6e7681">        Fernwood Health has an open request and has never been given a way to</tspan></text>
  <text xml:space="preserve" y="492"><tspan x="24.0" fill="#6e7681">        see it. Open their page, copy the portal link and send it — nothing</tspan></text>
  <text xml:space="preserve" y="512"><tspan x="24.0" fill="#6e7681">        they were asked for can arrive until they can read the question.</tspan></text>
  <text xml:space="preserve" y="552"><tspan x="24.0" fill="#c9d1d9">  </tspan><tspan x="40.8" fill="#6e7681">  …and 7 more, with their reasoning, in GET /v1/moves</tspan></text>
</svg>
