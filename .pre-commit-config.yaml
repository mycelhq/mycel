# Mycel pre-commit hooks. Install once:  pre-commit install
# Runs on every commit; keeps the tree clean and type-safe.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: typecheck
        name: tsc --noEmit (harness)
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        files: \.ts$
